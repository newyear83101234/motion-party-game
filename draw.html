<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fff4e0">
  <title>畫畫樂園</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="fonts/huninn-draw.woff2?v=8" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/draw.css?v=8">
  <link rel="modulepreload" href="js/draw-core.js?v=8">
  <link rel="modulepreload" href="js/draw-canvas.js?v=8">
  <link rel="modulepreload" href="js/draw-paint.js?v=8">
  <link rel="modulepreload" href="js/draw-fx.js?v=8">
  <link rel="modulepreload" href="js/draw-gallery.js?v=8">
  <link rel="modulepreload" href="js/draw-stickers.js?v=8">
  <link rel="modulepreload" href="js/draw-audio.js?v=8">
  <link rel="modulepreload" href="js/draw-particles.js?v=8">
  <link rel="modulepreload" href="js/draw-music.js?v=8">
  <link rel="modulepreload" href="js/draw-mirror.js?v=8">
  <link rel="modulepreload" href="js/draw-rewards.js?v=8">
  <link rel="modulepreload" href="js/draw-world.js?v=8">
  <link rel="modulepreload" href="js/draw-puzzle.js?v=8">
  <link rel="modulepreload" href="js/draw-seek.js?v=8">
</head>
<body>
  <!-- 首頁：上排選主題，下面是線稿縮圖 -->
  <section id="home" class="screen on">
    <header class="top hero">
      <img class="mascot" src="IMAGE/draw/ui/mascot.png?v=8" alt="" onerror="this.remove()">
      <h1 class="logo" aria-label="畫畫樂園"><span>畫</span><span>畫</span><span>樂</span><span>園</span></h1>
      <span class="grow"></span>
      <div class="setwrap">
      <button class="big tog" id="tSet" data-sfx="pop" aria-label="設定（大人用）"><svg viewBox="0 0 40 40" width="30" height="30"><path fill="#8a7458" d="M17 3h6l1 5 4 2 4-3 4 4-3 4 2 4 5 1v6l-5 1-2 4 3 4-4 4-4-3-4 2-1 5h-6l-1-5-4-2-4 3-4-4 3-4-2-4-5-1v-6l5-1 2-4-3-4 4-4 4 3 4-2z"/><circle cx="20" cy="20" r="6" fill="#fff"/></svg></button>
      <div class="setgroup">
      <button class="big tog" id="tSide" aria-label="工具列放左邊或右邊"><svg viewBox="0 0 40 40" width="40" height="40" fill="none" stroke-linejoin="round"><rect x="4" y="7" width="32" height="26" rx="5" fill="#fff" stroke="#3b2a1a" stroke-width="3"/><rect class="sideBar" x="27" y="10" width="6" height="20" rx="2" fill="#ffc93c" stroke="#3b2a1a" stroke-width="2"/><path d="M13 20h9M13 20l3.5-3.5M13 20l3.5 3.5" stroke="#3b2a1a" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      <button class="big tog" id="tMusic" data-sfx="none" aria-label="背景音樂開關">🎵</button>
      <button class="big tog" id="tSound" data-sfx="none" aria-label="音效開關">🔊</button>
      </div>
      </div>
      <nav class="modes">
        <button class="big mode m-mirror" id="toMirror" data-sfx="magic" aria-label="鏡子魔法畫" data-label="鏡子畫">🪞</button>
        <button class="big mode m-world off" id="toWorld" aria-label="我的世界" data-label="我的世界">🌍</button>
        <button class="big mode m-book off" id="toBook" aria-label="貼紙本" data-label="貼紙本">📖</button>
        <button class="big mode m-seek" id="toSeek" data-sfx="magic" aria-label="變色龍躲貓貓" data-label="躲貓貓">🔍</button>
        <button class="big mode m-gacha off" id="toDaily" data-sfx="magic" aria-label="今天的扭蛋" data-label="每日扭蛋">🎰</button>
        <button class="big gift" id="toScratch" data-sfx="magic" aria-label="刮刮樂驚喜" data-label="刮刮樂">🎁</button>
        <button class="big" id="toGallery" aria-label="作品牆" data-label="作品牆">🖼️</button>
      </nav>
    </header>
    <nav class="themes" id="themes"></nav>
    <div class="arts" id="arts"></div>
  </section>

  <!-- 畫畫頁：左邊畫布、右邊工具列 -->
  <section id="paint" class="screen">
    <div id="stage"><div id="loading" class="loading"><i></i><i></i><i></i></div></div>
    <button id="bZoom" class="corner zoom" aria-label="縮回原本大小"><svg viewBox="0 0 40 40" width="30" height="30" fill="none" stroke="#3b2a1a" stroke-width="4.5" stroke-linecap="round"><circle cx="17" cy="17" r="11" fill="#fff"/><path d="M11 17h12M26 26l9 9"/></svg></button>
    <button id="bFull" class="corner" aria-label="全螢幕"><svg viewBox="0 0 40 40" width="30" height="30" fill="none" stroke="url(#gFull)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="gFull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fc0ff"/><stop offset="1" stop-color="#1f7fe0"/></linearGradient></defs><path d="M5 15V5h10M25 5h10v10M35 25v10H25M15 35H5V25"/></svg></button>
    <nav id="bar">
      <button id="bDone" class="btn ok" data-sfx="none" aria-label="完成">✔️</button>
      <button id="bHome" class="btn" aria-label="回首頁">🏠</button>
      <hr>
      <button data-sfx="pick" class="btn tool on" data-tool="brush" aria-label="筆刷"></button>
      <button data-sfx="pick" class="btn tool" data-tool="sticker" aria-label="貼紙">⭐</button>
      <button data-sfx="pick" class="btn tool" data-tool="eraser" aria-label="橡皮擦">🧽</button>
      <hr>
      <button id="bColor" class="btn" data-sfx="pop" aria-label="顏色與材質"><span class="dot"></span></button>
      <hr>
      <button id="bUndo" class="btn" data-sfx="undo" aria-label="復原"><span>↩️</span></button>
      <button id="bClear" class="btn hold" aria-label="清空（要按住）">🗑️<i class="ring"></i></button>
    </nav>
    <!-- 全螢幕時右上角只留這三顆 -->
    <div id="mini" class="mini">
      <button id="mFull" class="btn" aria-label="離開全螢幕"><svg viewBox="0 0 40 40" width="32" height="32" fill="none" stroke="#3b2a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3v10H3M27 3v10h10M37 27H27v10M3 27h10v10"/></svg></button>
      <button id="mColor" class="btn" data-sfx="pop" aria-label="顏色"><span class="dot"></span></button>
      <button id="mUndo" class="btn" data-sfx="undo" aria-label="復原"><span>↩️</span></button>
    </div>
    <div id="pop" class="pop"></div>
    <button id="rStop" class="big" aria-label="停止回放"><svg viewBox="0 0 40 40" width="46" height="46"><defs><linearGradient id="gStop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a80"/><stop offset="1" stop-color="#e53935"/></linearGradient></defs><rect x="7" y="7" width="26" height="26" rx="7" fill="url(#gStop)"/></svg></button>
    <!-- 刮刮樂：畫好顏色的圖蓋一層銀色刮刮膜，用手指刮開；刮完選「自己畫這張」或「再刮一張」 -->
    <canvas id="foil" class="foil"></canvas>
    <div id="scratchBar" class="after scratch-bar">
      <div class="cheer" aria-hidden="true"><img src="IMAGE/draw/ui/mascot.png?v=8" alt="" onerror="this.remove()"><p class="sstars"><span class="sstar">★</span><span class="sstar">★</span><span class="sstar">★</span></p></div>
      <button class="big" id="sHome" aria-label="回首頁">🏠</button>
      <button class="big" id="sPaint" aria-label="自己畫這張">🖌️</button>
      <button class="big" id="sAgain" data-sfx="magic" aria-label="再刮一張">🎁</button>
    </div>
    <div id="after" class="after">
      <div class="cheer" aria-hidden="true"><img src="IMAGE/draw/ui/mascot.png?v=8" alt="" onerror="this.remove()"><p><span>★</span><span>★</span><span>★</span></p></div>
      <button class="big lead" id="aWorld" data-sfx="magic" aria-label="放進我的世界">🌍</button>
      <button class="big lead" id="aPuzzle" aria-label="變成拼圖">🧩</button>
      <button class="big" id="aMusic" data-sfx="none" aria-label="把畫彈成音樂">🎵</button>
      <button class="big" id="aPlay" aria-label="回放畫畫過程">▶️</button>
      <button class="big" id="aAgain" aria-label="繼續畫">🖌️</button>
      <button class="big" id="aHome" aria-label="回首頁">🏠</button>
    </div>
  </section>

  <!-- 作品牆 -->
  <section id="gallery" class="screen">
    <header class="top">
      <button class="big" id="gBack" aria-label="回首頁">🏠</button>
      <h2 class="wall-title"><span>我</span><span>的</span><span>作</span><span>品</span></h2>
      <span class="grow"></span>
      <button class="big" id="gTip" aria-label="加到主畫面"><svg viewBox="0 0 40 40" width="28" height="28" fill="none" stroke="#3b2a1a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="4" width="22" height="32" rx="4"/><path d="M20 13v12M14 19h12"/></svg></button>
    </header>
    <div id="tidyTip" class="tidy-tip">🖼️ 作品牆滿了：點一張舊作品，按住 🗑️ 刪掉，再按 🏠 回去存這張畫</div>
    <div class="works" id="works"></div>
    <div id="view" class="view">
      <img id="vImg" alt="">
      <div class="vbar">
        <button class="big" id="vClose" aria-label="關閉">✖️</button>
        <button class="big" id="vPlay" aria-label="回放畫畫過程">▶️</button>
        <button class="big" id="vEdit" aria-label="接著畫">🖌️</button>
        <button class="big" id="vPuzzle" aria-label="變成拼圖">🧩</button>
        <button class="big" id="vSave" data-sfx="save" aria-label="存到相簿">📥</button>
        <button class="big hold" id="vDel" aria-label="刪除（要按住）">🗑️<i class="ring"></i></button>
      </div>
    </div>
    <div id="tip" class="tip">建議把這個遊戲「加入主畫面」，之後都從主畫面的圖示打開來畫，作品比較不會不見（在 Safari 分頁裡畫的作品不會跟過去）。<br>按 Safari 的「分享」⬆️ →「加入主畫面」➕</div>
  </section>

  <div id="toast" class="toast"></div>
  <div id="rotate" class="rotate">📱 ↻</div>
  <script type="module" src="js/draw.js?v=8"></script>
</body>
</html>
