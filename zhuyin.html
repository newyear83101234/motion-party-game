<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1b4fa0">
  <link rel="icon" href="data:,">
  <title>注音小島</title>
  <!-- 3D 選單小島（js/zhuyin-hub3d.js）用的 Three.js 0.186.1：自架在 IMAGE/zy3d/vendor/（MIT，授權檔在同資料夾），只有選單要用時才由 zhuyin.js 動態載入。
       three.module.min.js 裡 import 的是 ./three.core.js → 這裡改指到壓縮版 three.core.min.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "./IMAGE/zy3d/vendor/three/build/three.module.min.js",
      "./IMAGE/zy3d/vendor/three/build/three.core.js": "./IMAGE/zy3d/vendor/three/build/three.core.min.js",
      "three/addons/": "./IMAGE/zy3d/vendor/three/examples/jsm/"
    }
  }
  </script>
  <!-- 自己的程式一開頁就同時抓（高優先）：不然要等 zhuyin.js 下載完才知道要抓 ann/words/ui，再等它跑起來才抓 hub3d，
       一層等一層，線上 4Mbps 實測多卡約 3 秒（tools/zy-test/loadprofile.js）。網址要跟實際 import 的完全一樣（含 ?v=） -->
  <link rel="modulepreload" href="js/zhuyin.js?v=13" fetchpriority="high">
  <link rel="modulepreload" href="js/zhuyin-words.js" fetchpriority="high">
  <link rel="modulepreload" href="js/zhuyin-ann.js" fetchpriority="high">
  <link rel="modulepreload" href="js/zhuyin-ui.js" fetchpriority="high">
  <link rel="modulepreload" href="js/zhuyin-hub3d.js?v=2" fetchpriority="high">
  <!-- Three.js 跟頁面一起開始抓（4Mbps 開頁快 0.6 秒）；?no3d 不抓。這裡不先測 WebGL2（建 context 會拖慢開頁），沒有 WebGL2 的極少數機器只是白抓 -->
  <script>
    (function () {
      if (/[?&]no3d\b/.test(location.search)) return;
      ["build/three.module.min.js", "build/three.core.min.js", "examples/jsm/loaders/GLTFLoader.js", "examples/jsm/utils/BufferGeometryUtils.js", "examples/jsm/utils/SkeletonUtils.js", "examples/jsm/geometries/RoundedBoxGeometry.js"].forEach(function (f) {
        var l = document.createElement("link"); l.rel = "modulepreload"; l.fetchPriority = "low"; l.href = "IMAGE/zy3d/vendor/three/" + f; document.head.appendChild(l);
      });
    })();
  </script>
  <!-- 樣式表放在上面兩段 script 後面：classic script 會等前面的樣式表下載完才執行，放前面會卡住整頁解析 -->
  <link rel="stylesheet" href="css/zhuyin.css?v=13">
</head>
<body>
  <!-- 讀取畫面：開頁與第一次進某個遊戲時，圖還沒抓好就蓋著（不會看到空白） -->
  <div id="loading" class="loading">
    <div class="ld-blocks"><span>ㄅ</span><span>ㄆ</span><span>ㄇ</span></div>
    <div class="ld-text">準備中…</div>
    <div class="ld-bar"><i></i></div>
  </div>

  <!-- 常駐按鈕：首頁 / 音樂 / 提示（右上）/ 家長設定（選單右上） -->
  <button id="homeBtn" class="round-btn" title="回首頁">🏠</button>
  <button id="musicBtn" class="round-btn" title="音樂">🎵</button>
  <button id="speakBtn" class="hint-btn hidden" title="提示"><span class="ic">🔊</span><span id="speakLabel">提示</span></button>
  <button id="settingsBtn" class="round-btn hidden" title="家長設定">⚙️</button>
  <button id="playerBtn" class="round-btn hidden" title="換人玩">🐻</button>

  <!-- 嚮導貓頭鷹（只在選單出現） -->
  <div id="guide" class="guide hidden"><img src="IMAGE/zhuyin/guide_owl.webp" alt=""><div id="guideText" class="guideText"></div></div>

  <!-- ===== 選單（注音小島） ===== -->
  <section id="menu" class="screen bg-map">
    <h1>注音小島</h1>
    <button id="resumeBtn" class="resume hidden"></button>
    <div class="mode-cards">
      <button class="mode-card" data-mode="fish"><span class="big">🎣</span><span class="label">釣魚</span><span class="lock"></span></button>
      <button class="mode-card" data-mode="order"><span class="big">🍔</span><span class="label">點餐</span><span class="lock"></span></button>
      <button class="mode-card" data-mode="build"><span class="big">🧩</span><span class="label">積木</span><span class="lock"></span></button>
      <button class="mode-card" data-mode="hunt"><span class="big">🔍</span><span class="label">尋寶</span><span class="lock"></span></button>
      <button class="mode-card" data-mode="match"><span class="big">🃏</span><span class="label">翻牌</span><span class="lock"></span></button>
      <button class="mode-card" data-mode="tone"><span class="big">🎈</span><span class="label">氣球</span><span class="lock"></span></button>
      <button class="mode-card" data-mode="whack"><span class="big">🔨</span><span class="label">地鼠</span><span class="lock"></span></button>
      <button class="mode-card" data-mode="frog"><span class="big">🐸</span><span class="label">青蛙</span><span class="lock"></span></button>
    </div>
    <div class="menu-bottom">
      <button id="albumBtn" class="pill"><span>📒 貼紙</span><b id="menuStickers">0</b></button>
      <button class="pill jarBtn"><span class="jar"><span class="jarFill"></span></span><span>⭐ <span class="jarText">0/10</span></span><span class="egg">🥚</span></button>
    </div>
  </section>

  <!-- ===== 共用頂列：進度點 ===== -->
  <div id="progress" class="progress hidden"></div>

  <!-- ===== 釣魚 ===== -->
  <section id="fish" class="screen bg-pond hidden">
    <div class="topbar"></div>
    <div id="fishPrompt" class="prompt"></div>
    <div id="pond" class="pond"></div>
  </section>

  <!-- ===== 點餐 ===== -->
  <section id="order" class="screen bg-shop hidden">
    <div class="topbar"></div>
    <div class="counter"><img id="customer" class="customer" alt=""><div id="bubble" class="bubble"></div></div>
    <div id="shelf" class="shelf"></div>
  </section>

  <!-- ===== 積木 ===== -->
  <section id="build" class="screen bg-blocks hidden">
    <div class="topbar"></div>
    <div class="build-top">
      <div id="buildPrompt" class="prompt small"></div>
      <div id="slots" class="slots"></div>
    </div>
    <div id="tray" class="tray"></div>
    <div id="toneRow" class="tray toneRow hidden"></div>
  </section>

  <!-- ===== 尋寶 ===== -->
  <section id="hunt" class="screen bg-park hidden">
    <div class="topbar"></div>
    <div class="hunt-top"><div id="huntBubble" class="bubble hunt"></div><div id="bag" class="bag">🎒 0</div></div>
    <div id="scene" class="scene"></div>
  </section>

  <!-- ===== 翻牌 ===== -->
  <section id="match" class="screen bg-table hidden">
    <div class="topbar"></div>
    <div id="board" class="board"></div>
  </section>

  <!-- ===== 聲調氣球 ===== -->
  <section id="tone" class="screen bg-sky hidden">
    <div class="topbar"></div>
    <div id="tonePrompt" class="prompt"></div>
    <div id="sky" class="sky"></div>
  </section>

  <!-- ===== 打地鼠 ===== -->
  <section id="whack" class="screen bg-garden hidden">
    <div class="topbar"></div>
    <div class="whack-main">
      <div class="wtarget"><div id="whackPic" class="wpic"></div><div id="whackDots" class="wdots"></div></div>
      <div id="field" class="field"></div>
    </div>
  </section>

  <!-- ===== 跳跳蛙 ===== -->
  <section id="frog" class="screen bg-frog hidden">
    <div class="topbar"></div>
    <div id="river" class="river"></div>
  </section>

  <!-- ===== 結算 ===== -->
  <section id="result" class="screen bg-map hidden">
    <div id="resultText" class="result-text"></div>
    <div id="resultStars" class="stars"></div>
    <div id="resultStickers" class="result-stickers"></div>
    <div class="result-btns">
      <button id="againBtn" class="big-btn">🔁 再玩</button>
      <button id="resultAlbumBtn" class="big-btn alt">📒 貼紙</button>
      <button id="menuBtn" class="big-btn alt">🏝️ 回小島</button>
    </div>
    <button id="hatchHint" class="pill jarBtn ready hidden"><span class="jar"><span class="jarFill"></span></span><span>⭐ <span class="jarText">0/10</span></span><span class="egg">🥚 孵蛋！</span></button>
  </section>

  <!-- ===== 貼紙圖鑑 ===== -->
  <section id="album" class="screen bg-album hidden">
    <div class="album-head"><button id="albumBack" class="big-btn alt small">⬅️</button><h2>📒 我的貼紙 <span id="albumCount" class="nw"></span></h2></div>
    <div id="albumTabs" class="tabs"></div>
    <div id="albumGrid" class="album-grid"></div>
  </section>

  <!-- ===== 覆蓋層：回家確認 / 孵蛋 ===== -->
  <div id="confirm" class="overlay hidden"><div class="dialog"><div class="q">⏸️ 暫停</div><div class="row wrap"><button id="confirmNo" class="big-btn">▶️ 繼續玩</button><button id="confirmRestart" class="big-btn alt">🔄 重新開始</button><button id="confirmYes" class="big-btn alt">🏝️ 回小島</button></div></div></div>
  <!-- 換人玩：三個存檔位 -->
  <div id="players" class="overlay hidden"><div class="dialog"><div class="q">👋 誰要玩？</div><div id="playerList" class="row wrap"></div></div></div>
  <!-- 翻牌選張數 -->
  <div id="matchPick" class="overlay hidden"><div class="dialog"><div class="q">🃏 要翻幾張牌？</div><div id="matchSizes" class="row wrap"></div><button id="matchPickClose" class="big-btn alt small">↩️ 回去</button></div></div>
  <div id="settings" class="overlay hidden"><div class="dialog settings">
    <div class="q">⚙️ 家長設定</div>
    <div class="set-label">🔊 小朋友多久沒<span class="nw">動作，</span><wbr><span class="nw">「提示」</span>按鈕會<span class="nw">閃爍提醒？</span></div>
    <div class="row" id="hintOpts"><button class="opt" data-v="0">關閉</button><button class="opt" data-v="10">10 秒</button><button class="opt" data-v="20">20 秒</button><button class="opt" data-v="30">30 秒</button></div>
    <div class="set-note noann">遊戲不會自己唸出答案，<br>小朋友按<span class="nw">「🔊 提示」</span>才會唸。<br>同一題答錯 2 次，提示按鈕也會閃；<br>這時按提示，正確答案會輕輕晃一下。</div>
    <div class="set-label">💾 存檔：<span id="setSlotName"></span></div>
    <div class="row wrap"><button id="backupBtn" class="opt">📋 備份</button><button id="restoreBtn" class="opt">📥 還原</button><button id="resetBtn" class="opt danger">🗑️ 清除重來</button></div>
    <textarea id="saveCode" class="save-code hidden" rows="2" spellcheck="false"></textarea>
    <div id="saveMsg" class="set-note noann"></div>
    <div class="set-note noann">進度會自動存在這台平板的瀏覽器裡。<br>換平板或清除瀏覽器資料前，先按「備份」把備份碼存起來。</div>
    <button id="settingsClose" class="big-btn">✅ 好</button>
  </div></div>
  <div id="hatch" class="overlay hidden"><div class="dialog hatchBox"><div id="hatchEgg" class="hatchEgg"></div><img id="hatchFriend" class="hatchFriend hidden" alt=""><div id="hatchName" class="q"></div><button id="hatchClose" class="big-btn">🎉 太棒了</button></div></div>

  <div id="fx" class="fx"></div>
  <script type="module" src="js/zhuyin.js?v=13"></script>
</body>
</html>
