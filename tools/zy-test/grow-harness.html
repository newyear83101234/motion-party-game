<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>小魚長大記 試玩</title>
<!-- 獨立試玩頁（不經過主程式）：python -m http.server 8765（專案根目錄）→ http://127.0.0.1:8765/tools/zy-test/grow-harness.html
     參數：?speed=4 遊戲時間快 4 倍｜?zone=3 從第 3 區開始（1 起算；9 以上＝第 2 圈挑戰模式）｜?intro=1 第一次玩（手指示範）
          ?clean=1 收起試玩工具列（截圖用）｜?seed=1 固定亂數｜?ann=1 跑主程式的自動注音｜?best=500 假裝最佳紀錄分數｜?sound=1 有聲音
     假的 api：say／talk 印在左下角＋console；later 用 setTimeout（暫停時延後）；best 讀 localStorage（zyGrowLab_best）。
     左上角的 🏠🎵 是假的主程式圓鈕（看會不會跟遊戲擋到）：🏠＝暫停／繼續 -->
<link rel="stylesheet" href="../../css/zhuyin.css">
<link rel="stylesheet" href="../../css/zhuyin-grow.css">
<style>
  #grow { background: #1f9fcc; }
  #growRoot { position: absolute; inset: 0; }
  #homeBtn { left: 2vmin; top: 2vmin; } #musicBtn { left: 16vmin; top: 2vmin; }
  #homeBtn.on { background: #ffd54a; }
  #lab { position: fixed; z-index: 50; left: 50%; bottom: 1vmin; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: center;
    max-width: 70vw; padding: 4px 6px; border-radius: 10px; background: rgba(20, 30, 50, .72); color: #fff; font: 12px/1.3 system-ui, sans-serif; }
  #lab button { font: 12px system-ui, sans-serif; padding: 3px 7px; border-radius: 6px; background: #fff; color: #123; }
  #lab button.on { background: #ffd54a; }
  #labLog { position: fixed; z-index: 50; left: 1vmin; bottom: 6vmin; max-width: 45vw; color: #fff; font: 12px/1.35 ui-monospace, Consolas, monospace; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre-wrap; }
  #labResult { position: fixed; z-index: 60; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.35); }
  #labResult div { background: #fff; border-radius: 3vmin; padding: 3vmin 5vmin; font: bold 3.4vmin/1.5 system-ui, sans-serif; color: #1b4fa0; text-align: center; white-space: pre-line; }
  .clean #lab, .clean #labLog { display: none; }
</style>
</head>
<body>
<section id="grow" class="screen"><div id="growRoot"></div></section>
<button class="round-btn" id="homeBtn" aria-label="暫停">🏠</button>
<button class="round-btn" id="musicBtn" aria-label="音樂">🎵</button>
<div id="lab" class="noann"></div>
<div id="labLog" class="noann"></div>
<div id="labResult" class="hidden noann"><div></div></div>
<script type="module">
  import * as mod from "../../js/zhuyin-grow.js";
  const Q = new URLSearchParams(location.search);
  const speed = Math.max(0.1, +Q.get("speed") || 1);
  const clean = Q.get("clean") === "1";
  if (clean) document.body.classList.add("clean");
  if (Q.get("ann") === "1") import("../../js/zhuyin-ann.js?v=16").then(m => { m.startAnnotate(); window.__lab.ann = m; });
  const lines = [], calls = { say: [], talk: [], play: [], answer: [], zone: [], end: [], stopVoice: 0, laterAfterStop: 0 };
  const log = (k, t) => { lines.push(`${k}: ${t}`); while (lines.length > 7) lines.shift(); document.getElementById("labLog").textContent = lines.join("\n"); console.log("[grow]", k, t); };
  let paused = false;
  const BEST = "zyGrowLab_best";
  const api = {
    speed,
    say: (t, alt, cb) => { calls.say.push(t); log("念", t + (alt && alt !== t ? `（${alt}）` : "")); if (cb) setTimeout(cb, 900 / speed); },
    talk: (t, cb) => { calls.talk.push(t); log("說", t); if (cb) setTimeout(cb, (500 + t.length * 140) / speed); },
    play: n => { calls.play.push(n); if (Q.get("sound") === "1") { try { const a = new Audio(`../../MUSIC/zy_${n}.mp3`); a.play().catch(() => {}); } catch (e) {} } },
    later: (fn, ms) => { const tick = () => { if (paused) { setTimeout(tick, 50); return; } fn(); }; setTimeout(tick, ms); },   // 暫停時延後（跟主程式的 gLater 一樣凍結）
    paused: () => paused,
    stopVoice: () => { calls.stopVoice++; },
    best: () => { if (Q.has("best")) return { zone: 0, score: +Q.get("best") || 0 }; try { return JSON.parse(localStorage.getItem(BEST)) || { zone: 0, score: 0 }; } catch (e) { return { zone: 0, score: 0 }; } },
    onAnswer: r => { calls.answer.push({ ok: r.ok, got: r.got, answer: r.q && r.q.answer, tier: r.q && r.q.tier }); },
    onZone: r => { calls.zone.push(r); log("onZone", JSON.stringify(r)); },
    onEnd: r => {
      calls.end.push(r); log("onEnd", JSON.stringify(r));
      if (r.record && !Q.has("best")) { try { localStorage.setItem(BEST, JSON.stringify({ zone: r.zone, score: r.score })); } catch (e) {} }
      if (clean) return;
      const box = document.getElementById("labResult");
      box.firstElementChild.textContent = `${r.finished ? "長成魚王了！" : r.rest ? "休息一下" : "心用完了"}\n第 ${r.zone + 1} 區　分數 ${r.score}　金幣 ${r.coins}　⭐${r.stars}\n吃對 ${r.right}　吃錯 ${r.wrong}　${Math.round(r.ms / 1000)} 秒${r.record ? "　破紀錄！" : ""}`;
      box.classList.remove("hidden");
    },
  };
  if (Q.has("seed")) api.seed = +Q.get("seed");
  const root = document.getElementById("growRoot");
  const game = mod.createGrowGame(root, api);
  const setPaused = v => { paused = !!v; document.getElementById("homeBtn").classList.toggle("on", paused); };
  window.__lab = { mod, game, api, calls, setPaused, paused: () => paused };

  const bar = document.getElementById("lab");
  const zone0 = Math.max(1, +Q.get("zone") || 1) - 1;
  const restart = z => { document.getElementById("labResult").classList.add("hidden"); game.start({ zone: z, intro: Q.get("intro") === "1" }); };
  mod.ZONES.forEach((z, i) => { const b = document.createElement("button"); b.textContent = `${i + 1}${z.ico}`; b.onclick = () => restart(i); bar.appendChild(b); });
  const H = () => window.__zyGrow;
  const extra = [["挑戰", () => restart(8)], ["⏸", () => setPaused(!paused)], ["吃對", () => H().answer(true)], ["吃錯", () => H().answer(false)], ["被咬", () => H().hurt({ force: true })],
    ["任務完", () => H().finishTask()], ["進化", () => H().evolve()], ["大魚", () => H().spawnPred({ big: true })], ["休息", () => H().rest()], ["停", () => game.stop()]];
  for (const [t, f] of extra) { const b = document.createElement("button"); b.textContent = t; b.onclick = f; bar.appendChild(b); }
  document.getElementById("homeBtn").onclick = () => setPaused(!paused);
  document.getElementById("labResult").onclick = () => document.getElementById("labResult").classList.add("hidden");
  addEventListener("resize", () => game.relayout());
  restart(zone0);
  window.__lab.ready = true;
</script>
</body>
</html>
