<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>泡泡救援灣 試玩</title>
<!-- 獨立試玩頁：python -m http.server 8765（專案根目錄）→ http://127.0.0.1:8765/tools/zy-test/bubble-lab.html
     參數：?lv=3 開第 3 關｜?clean=1 收起試玩工具列（截圖用）｜?fast=4 計時器快 4 倍（測試用）｜?seed=1 固定亂數｜?ann=1 跑主程式的自動注音 -->
<link rel="stylesheet" href="../../css/zhuyin.css">
<link rel="stylesheet" href="../../css/zhuyin-bubble.css">
<style>
  #stage { background: #8fd3ff; }
  #bbRoot { position: absolute; inset: 0; }
  #lab { position: fixed; z-index: 50; left: 50%; top: 1vmin; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: center;
    max-width: 52vw; padding: 4px 6px; border-radius: 10px; background: rgba(20, 30, 50, .72); color: #fff; font: 12px/1.3 system-ui, sans-serif; }
  #lab button { font: 12px system-ui, sans-serif; padding: 3px 7px; border-radius: 6px; background: #fff; color: #123; }
  #lab button.on { background: #ffd54a; }
  #labLog { position: fixed; z-index: 50; left: 1vmin; bottom: 1vmin; max-width: 60vw; color: #fff; font: 12px/1.35 ui-monospace, Consolas, monospace; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre-wrap; }
  #labResult { position: fixed; z-index: 60; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.35); }
  #labResult div { background: #fff; border-radius: 3vmin; padding: 3vmin 5vmin; font: bold 4vmin system-ui, sans-serif; color: #1b4fa0; text-align: center; }
  .clean #lab, .clean #labLog { display: none; }
</style>
</head>
<body>
<section id="stage" class="screen"><div id="bbRoot"></div></section>
<!-- 試玩工具列／紀錄／結果加 .noann：主程式自動注音不處理（測試只檢查遊戲本身的字）。假的主程式圓鈕（看會不會跟遊戲擋到）：🏠＝暫停／繼續 -->
<button class="round-btn" id="homeBtn" aria-label="暫停">🏠</button>
<button class="round-btn" id="musicBtn" aria-label="音樂">🎵</button>
<button class="round-btn" id="settingsBtn" aria-label="設定">⚙️</button>
<div id="lab" class="noann"></div>
<div id="labLog" class="noann"></div>
<div id="labResult" class="hidden noann"><div></div></div>
<script type="module">
  import * as mod from "../../js/zhuyin-bubble.js";
  const Q = new URLSearchParams(location.search);
  const fast = Math.max(1, +Q.get("fast") || 1);
  if (Q.get("clean") === "1") document.body.classList.add("clean");
  if (Q.get("ann") === "1") import("../../js/zhuyin-ann.js?v=2").then(m => { m.startAnnotate(); window.__bb.ann = m; });
  const lines = [], calls = { say: [], talk: [], play: [], win: [], full: [] };
  const log = (k, t) => { lines.push(`${k}: ${t}`); while (lines.length > 6) lines.shift(); document.getElementById("labLog").textContent = lines.join("\n"); console.log("[bubble]", k, t); };
  let paused = false;
  const api = {
    say: t => { calls.say.push(t); log("say", t); },
    talk: t => { calls.talk.push(t); log("talk", t); },
    play: (n, r = 1) => { calls.play.push(n); if (Q.get("mute") === "1") return; try { const a = new Audio(`../../MUSIC/zy_${n}.mp3`); a.playbackRate = r; a.play().catch(() => {}); } catch (e) {} },
    later: (fn, ms) => setTimeout(fn, ms / fast),
    paused: () => paused,
    onWin: info => { calls.win.push(info); log("onWin", JSON.stringify(info)); if (Q.get("clean") === "1") return; const r = document.getElementById("labResult"); r.firstElementChild.textContent = `過關！第 ${info.level + 1} 關　發射 ${info.shots}（par ${info.par}）　${"★".repeat(info.stars)}`; r.classList.remove("hidden"); },
    onFull: info => { calls.full.push(info); log("onFull", JSON.stringify(info)); },
    animalImgs: { penguin: "../../IMAGE/zhuyin/cust_penguin.webp", crab: "../../IMAGE/zhuyin/pets/crab.webp", whale: "../../IMAGE/zhuyin/pets/whale.webp" },
  };
  if (Q.has("seed")) api.seed = +Q.get("seed");
  const game = mod.createBubbleGame(document.getElementById("bbRoot"), api);
  window.__bb = { mod, game, api, calls, setPaused: v => { paused = !!v; document.getElementById("homeBtn").classList.toggle("on", paused); } };

  const bar = document.getElementById("lab");
  mod.LEVELS.forEach((_, i) => { const b = document.createElement("button"); b.textContent = i + 1; b.onclick = () => { document.getElementById("labResult").classList.add("hidden"); game.start(i); mark(i); }; bar.appendChild(b); });
  const extra = [["⏸", () => window.__bb.setPaused(!paused)], ["🔊", () => game.sayCurrent()], ["示範", () => game.debug.showDemo()], ["最佳", () => { const b = game.debug.bestShot(); if (b) { if (b.swap) game.debug.swap(); game.debug.aim(b.angle); } }]];
  for (const [t, f] of extra) { const b = document.createElement("button"); b.textContent = t; b.onclick = f; bar.appendChild(b); }
  function mark(i) { [...bar.children].forEach((b, k) => b.classList.toggle("on", k === i)); }
  document.getElementById("homeBtn").onclick = () => window.__bb.setPaused(!paused);
  document.getElementById("labResult").onclick = () => document.getElementById("labResult").classList.add("hidden");
  addEventListener("resize", () => game.relayout());
  const lv = Math.max(1, Math.min(mod.LEVELS.length, +Q.get("lv") || 1)) - 1;
  game.start(lv); mark(lv);
  window.__bb.ready = true;
</script>
</body>
</html>
